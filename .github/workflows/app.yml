name: app
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/app.yml]
  pull_request:
    paths: [android/**, .github/workflows/app.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$APP_KEYSTORE" ]; then
            echo "$APP_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
      # Obtainium installs the APK attached to the latest release; its tag matches the app's version name.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
          VERSION: 1.${{ github.run_number }}
        run: |
          # Without the signing key the build is app-release-unsigned.apk, which Android won't install.
          cp app/build/outputs/apk/release/app-release.apk "news-$VERSION.apk"
          gh release create "v$VERSION" "news-$VERSION.apk" --title "News $VERSION" --notes "${NOTES:-Build $VERSION}"
